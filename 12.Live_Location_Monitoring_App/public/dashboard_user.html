<!-- dashboard_user.html -->
<!DOCTYPE html>
<html>
<head>
  <title>User Dashboard</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f8f8f8; }
    .container { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 0 8px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
    .track-btn { margin: 4px 0; padding: 8px 16px; display: block; background: #eef; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h2>📍 Welcome, <span id="username"></span></h2>
    <h3>🔗 Generate Tracking Link</h3>
    <button onclick="generateLink()">Generate Shareable Link</button>
    <p id="linkArea"></p>
    <h3>👥 People You're Tracking</h3>
    <div id="trackingList">Loading...</div>
  </div>

  <script>
    const firebaseConfig = { /* your config here */ };
    firebase.initializeApp(firebaseConfig);

    const user = new URLSearchParams(window.location.search).get('user');
    document.getElementById('username').textContent = user;

    function generateLink() {
      const uid = 'user_' + Math.random().toString(36).substring(2, 10);
      firebase.database().ref(`locations/${user}/shared/${uid}`).set(true);
      const link = `${window.location.origin}/send_from_browser.html?user=${uid}`;
      document.getElementById('linkArea').innerHTML = `<a href="${link}" target="_blank">${link}</a>`;
    }

    firebase.database().ref(`locations/${user}/shared`).on('value', snap => {
      const list = document.getElementById('trackingList');
      list.innerHTML = '';
      if (!snap.exists()) return list.textContent = 'No users tracking yet.';
      const data = snap.val();
      Object.keys(data).forEach(uid => {
        firebase.database().ref(`locations/${uid}/name`).once('value').then(nameSnap => {
          const name = nameSnap.exists() ? nameSnap.val() : uid;
          const btn = document.createElement('button');
          btn.textContent = name;
          btn.className = 'track-btn';
          btn.onclick = () => location.href = `map_user.html?user=${uid}`;
          list.appendChild(btn);
        });
      });
    });
  </script>
</body>
</html>
